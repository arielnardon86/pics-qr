name: Keep Render service awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # Render free cold starts can take ~60s, and GitHub often delays scheduled
        # runs past the 15-min sleep window, so allow a long timeout plus retries.
        run: curl -sf --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors https://totalpics.com.ar/api/health
